<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>陪伴工作台 · 不离不弃</title><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head>
<body><header><a href="/">不离不弃 · 同修陪伴</a><span>陪伴工作台</span></header>
<main><p id="globalMessage" role="status" class="notice hidden"></p>
<section id="authSection" class="card narrow"><h1 id="authTitle">欢迎回来</h1><p id="authIntro">指定的管理同学登录后，可查看和跟进私密留言。</p>
<form id="loginForm"><label for="email">邮箱</label><input type="email" id="email" required maxlength="254" autocomplete="username"><label for="password">密码</label><input type="password" id="password" required maxlength="128" autocomplete="current-password"><button class="primary" type="submit">登录工作台</button><p class="muted">忘记密码时，请联系超级管理员重新生成开通链接。</p></form>
<form id="activateForm" class="hidden"><label for="displayName" id="displayNameLabel" class="hidden">你的称呼</label><input id="displayName" maxlength="50" class="hidden" autocomplete="name"><label for="newPassword">设置密码（12至128个字符）</label><input type="password" id="newPassword" required minlength="12" maxlength="128" autocomplete="new-password"><label for="repeatPassword">再次输入密码</label><input type="password" id="repeatPassword" required minlength="12" maxlength="128" autocomplete="new-password"><button class="primary" type="submit">确认开通</button></form><p id="authError" class="error" role="alert"></p></section>
<section id="workspace" class="hidden"><div class="toolbar"><div><h1>让每一份留言有人接住</h1><p id="signedIn" class="muted"></p></div><div class="row"><button id="refresh">刷新</button><button id="passwordButton">修改密码</button><button id="logout">退出</button></div></div>
<div id="summary" class="summary" aria-label="留言进度概览"></div><p id="overdue" class="error"></p><p class="muted">先确认对方希望怎样被陪伴；复制联系方式后，到微信或电话人工联系。没有自动通知，请轮值同学定时查看。</p>
<nav class="tabs"><button id="messageTab" class="selected">留言跟进</button><button id="staffTab" class="hidden">同学账号</button></nav>
<section id="messagesPanel"><div class="filters"><label>进度<select id="statusFilter"><option value="">全部进度</option><option value="pending">待回应</option><option value="contacted">已联系</option><option value="accompanying">陪伴中</option><option value="closed">已结束</option></select></label><label>负责人<select id="assigneeFilter"><option value="">全部负责人</option></select></label><button id="applyFilter">查看</button></div><p id="listError" class="error" role="alert"></p><div id="messageList" class="messageList"></div><button id="loadMore" class="hidden">加载更早的留言</button></section>
<section id="staffPanel" class="hidden"><div class="card"><h2>添加管理同学</h2><p class="muted">创建后复制一次性开通链接，手工发送给本人。链接24小时内有效，只能使用一次。普通管理员可查看全部留言、分配负责人和跟进，无删除权限。</p><form id="staffForm" class="staffForm"><label>称呼<input id="staffName" required maxlength="50" autocomplete="off"></label><label>邮箱<input type="email" id="staffEmail" required maxlength="254" autocomplete="off"></label><button class="primary" type="submit">生成开通链接</button></form><p id="staffError" class="error" role="alert"></p><div id="activationBox" class="notice hidden"><p>仅将此链接发给账号本人：</p><input id="activationUrl" readonly aria-label="一次性开通链接"><button id="copyActivation">复制开通链接</button></div></div><div id="staffList"></div></section>
</section>
<dialog id="detailDialog"><form method="dialog"><button class="close" aria-label="关闭留言详情">×</button></form><div id="detailContent"></div></dialog>
<dialog id="passwordDialog"><form method="dialog"><button class="close" aria-label="关闭密码窗口">×</button></form><h2>修改密码</h2><form id="passwordForm"><label for="currentPassword">原密码</label><input id="currentPassword" type="password" required maxlength="128" autocomplete="current-password"><label for="changedPassword">新密码（12至128个字符）</label><input id="changedPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><label for="changedRepeat">再次输入新密码</label><input id="changedRepeat" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><p id="passwordError" class="error" role="alert"></p><button class="primary">确认修改并退出全部设备</button></form></dialog>
</main><footer>留言仅用于陪伴。请勿复制到群聊或转给团队外的人；需要邀请其他人参与时，先征得留言者同意。</footer></body></html>
