<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f5f4ef">
<title>丸承三百载 · 两套设计方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#2c342f;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1440px;margin:auto;padding:46px 40px 24px}a{color:inherit}a:focus-visible,button:focus-visible{outline:2px solid #4e7868;outline-offset:5px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:30px;border-bottom:1px solid #d9ddd5}.kicker{font-size:11px;letter-spacing:.22em;color:#738074;margin:0 0 12px}h1{font-family:"STKaiti","KaiTi","Songti SC",serif;font-size:40px;font-weight:400;letter-spacing:.07em;margin:0}.intro{font-size:13px;line-height:1.9;color:#6c766d;margin:12px 0 0}.original{font-size:12px;text-decoration:none;white-space:nowrap;border-bottom:1px solid #b0b9ae;padding:7px 0}.state-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 0}.state-label{font-size:12px;color:#6b756d}.tabs{display:flex;padding:4px;background:#e8ebe4;border-radius:5px;gap:4px}.tabs button{font:inherit;font-size:12px;background:none;color:#69776c;border:0;border-radius:3px;padding:12px 23px;cursor:pointer;touch-action:manipulation}.tabs button[aria-selected=true]{background:#fff;color:#2f483a;box-shadow:0 1px 4px #1b352111}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:30px}.design{min-width:0;background:#fff;border:1px solid #dfe3da;border-radius:5px;overflow:hidden}.design-header{display:flex;align-items:center;gap:14px;padding:22px 24px 0}.letter{font-size:13px;width:32px;height:32px;display:grid;place-items:center;border:1px solid #d8c5a9;color:#8b4430}.design-b .letter{border-color:#bed8de;color:#327585}.design-header h2{font-size:20px;font-weight:400;letter-spacing:.1em;margin:0}.description{font-size:12px;color:#738074;line-height:1.8;margin:11px 24px 20px}.preview-link{display:block;position:relative;background:#eeeae1;overflow:hidden}.preview-link img{display:block;width:100%;height:auto;aspect-ratio:1.44;object-fit:contain;transition:filter .2s}.preview-link:hover img{filter:brightness(1.035)}.image-caption{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 24px;border-top:1px solid #e8ebe5}.state-name{font-size:11px;color:#778276}.launch-link{font-size:12px;text-decoration:none;color:#3f6452;min-height:36px;display:inline-flex;align-items:center;gap:12px}.launch-link:hover{text-decoration:underline}.below{font-size:12px;color:#68766b;line-height:1.9;margin:25px 0}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #d9ddd5;margin-top:25px;padding:17px 0;font-size:10px;color:#879084}footer p{margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){main{padding:26px 18px 20px}header{align-items:flex-start;gap:15px;flex-direction:column;padding-bottom:22px}h1{font-size:31px}.intro{font-size:12px}.original{font-size:11px}.state-bar{align-items:flex-start;flex-direction:column;gap:13px;padding:20px 0}.tabs{width:100%}.tabs button{flex:1;padding:12px 9px}.comparison{grid-template-columns:1fr;gap:22px}.design-header{padding:19px 18px 0}.design-header h2{font-size:19px}.description{margin:10px 18px 17px}.image-caption{padding:12px 18px}.below{font-size:11px}footer{flex-direction:column;gap:6px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header><div><p class="kicker">丸承三百载 / 设计方向确认</p><h1>两种风格，同一段演变</h1><p class="intro">比较首页布局与第一阶段展开效果，再进入演示实际点击体验。</p></div><a class="original" href="index.html">查看原版演示 ↗</a></header>
<div class="state-bar"><span class="state-label">两套方案同步切换，方便对照</span><div class="tabs" role="tablist" aria-label="对照画面"><button id="tab-home" type="button" role="tab" aria-selected="true" aria-controls="comparison" data-view="home">首页布局</button><button id="tab-first" type="button" role="tab" aria-selected="false" aria-controls="comparison" data-view="first" tabindex="-1">第一阶段展开</button></div></div>
<section id="comparison" class="comparison" role="tabpanel" aria-labelledby="tab-home">
<article class="design design-a"><div class="design-header"><span class="letter">A</span><h2>宣纸册页</h2></div><p class="description">纸色与朱砂色 · 四角围合布局 · 传统药文化的历史感</p><a class="preview-link" href="style-a.html" data-style="a" aria-label="打开方案 A 宣纸册页首页"><img src="assets/previews/a-home.jpg" width="1440" height="1000" alt="方案 A 宣纸册页首页效果" id="preview-a"></a><div class="image-caption"><span class="state-name">首页布局</span><a class="launch-link" data-style="a" href="style-a.html">打开可点击演示 <span aria-hidden="true">↗</span></a></div></article>
<article class="design design-b"><div class="design-header"><span class="letter">B</span><h2>科技环廊</h2></div><p class="description">深蓝与冰青色 · 上右下左环绕布局 · 现代展馆的科技感</p><a class="preview-link" href="style-b.html" data-style="b" aria-label="打开方案 B 科技环廊首页"><img src="assets/previews/b-home.jpg" width="1440" height="1000" alt="方案 B 科技环廊首页效果" id="preview-b"></a><div class="image-caption"><span class="state-name">首页布局</span><a class="launch-link" data-style="b" href="style-b.html">打开可点击演示 <span aria-hidden="true">↗</span></a></div></article>
</section>
<p class="below">两套均保留四阶段入口、点击后显示阶段介绍、三个主题菜单、图文详情、自动切换与收起按钮。</p>
<p class="sr-only" id="comparison-status" role="status" aria-live="polite">当前对比：首页布局</p>
<footer><p>视觉与交互确认稿 · 现有素材暂用</p><p>页面背景用于预览，透明效果以上屏为准。</p></footer>
</main>
<script>
const tabs=[...document.querySelectorAll('[data-view]')];
function choose(view){
 const label=view==='home'?'首页布局':'第一阶段展开';
 tabs.forEach(button=>{const active=button.dataset.view===view;button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1;});
 document.getElementById('comparison').setAttribute('aria-labelledby','tab-'+view);
 for(const style of ['a','b']){
  const image=document.getElementById('preview-'+style);image.src='assets/previews/'+style+'-'+view+'.jpg';image.alt='方案 '+style.toUpperCase()+' '+label+'效果';
  document.querySelectorAll('[data-style="'+style+'"]').forEach(link=>{link.href='style-'+style+'.html'+(view==='first'?'?stage=1':'');if(link.classList.contains('preview-link'))link.setAttribute('aria-label','打开方案 '+style.toUpperCase()+' '+label);});
 }
 document.querySelectorAll('.state-name').forEach(el=>el.textContent=label);
 document.getElementById('comparison-status').textContent='当前对比：'+label;
}
tabs.forEach(button=>{button.addEventListener('click',()=>choose(button.dataset.view));button.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const target=event.key==='Home'?tabs[0]:event.key==='End'?tabs[1]:tabs.find(tab=>tab!==button);choose(target.dataset.view);target.focus();}});});
</script>
</body></html>
