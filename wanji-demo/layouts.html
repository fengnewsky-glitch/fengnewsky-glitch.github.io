<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>丸承三百载 · 首页五种布局</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ef;color:#222e29;font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1500px;margin:auto;padding:42px 38px 32px}header{border-bottom:1px solid #d9dfd8;padding-bottom:25px}.eyebrow{color:#7b887e;letter-spacing:.17em;font-size:12px;margin:0 0 12px}h1{font-size:30px;font-weight:500;margin:0 0 12px}header p{color:#68776e;line-height:1.8;margin:0;font-size:14px}.viewer{margin-top:25px}.viewer-title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:13px}.viewer-title h2{font-size:20px;font-weight:500;margin:0}.viewer-title p{font-size:13px;color:#738078;margin:0;text-align:right}.canvas{background-color:#101d1a;background-image:linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.045) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.045) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.045) 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0;border-radius:5px;overflow:hidden;line-height:0}.canvas svg{width:100%;height:auto;display:block}.caption{font-size:12px;color:#78867c;line-height:1.8;margin:10px 0 0}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-top:24px}.choice{padding:0;text-align:left;background:#fff;border:1px solid #dce2dc;border-radius:5px;overflow:hidden;cursor:pointer;color:inherit;font:inherit}.choice:hover,.choice[aria-pressed=true]{border-color:#7a9d89;box-shadow:0 0 0 2px rgba(86,139,106,.16)}.choice:focus-visible{outline:3px solid #8db6a0;outline-offset:3px}.choice .canvas{border-radius:0;pointer-events:none}.choice-copy{padding:11px 12px 13px;display:flex;align-items:baseline;gap:9px}.number{font-size:11px;color:#758b7c}.choice-name{font-size:14px}.tip{font-size:13px;color:#68776e;line-height:1.8;margin:24px 0}.back{color:#547565;font-size:13px}footer{border-top:1px solid #d9dfd8;padding-top:16px;margin-top:25px;font-size:12px;color:#78867c;line-height:1.8}@media(max-width:800px){main{padding:25px 16px}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.viewer-title{align-items:flex-start;flex-direction:column;gap:6px}.viewer-title p{text-align:left}h1{font-size:25px}.choice-copy{padding:10px}.canvas{background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}}@media(max-width:360px){.choices{grid-template-columns:1fr 1fr}.choice-name{font-size:12px}}
</style>
</head>
<body><main>
<header><p class="eyebrow">丸承三百载 / 首页布局选择</p><h1>四个阶段 · 五种排列方式</h1><p>只比较四个阶段图标的位置和观看顺序。点击下方方案，可在上方放大查看。</p></header>
<style>.choice .canvas{display:block}</style>
<section class="viewer" aria-label="放大预览"><div class="viewer-title"><h2 id="selected-title"></h2><p id="selected-description"></p></div><div class="canvas" id="large-preview"></div><p class="caption">网格是透明区域的示意；画面按三块竖屏左右并排作比例假设，最终以实际设备为准。</p></section>
<section class="choices" id="choices" aria-label="选择首页布局"></section>
<p class="tip">每个阶段作为独立图标块，图标之间留出空间。连接线和图标外观仅用于说明顺序，后续可调整。</p>
<a class="back" href="index.html">查看之前的展示版本 ↗</a>
<footer>首页布局示意 · 图标、文字和空间比例可继续调整；实际透明效果需上屏确认。</footer>
</main>
<script>
const stages=[
 {name:'源起',sub:'竹匾上的手工时代',img:'handcraft.png'},
 {name:'汇流',sub:'公私合营与半机械化',img:'tools.png'},
 {name:'提速',sub:'工艺现代化的三级跳',img:'workshop.jpg'},
 {name:'智造',sub:'从联动线到智慧工厂',img:'production.jpg'}
];
const layouts=[
 {title:'方案一 · 横向时间线',description:'从左到右，一眼看懂四个阶段的先后顺序。',positions:[[210,395],[520,395],[830,395],[1140,395]],path:'M270 395 L460 395 M580 395 L770 395 M890 395 L1080 395',arrows:[[425,395],[735,395],[1045,395]]},
 {title:'方案二 · 逐步向上',description:'从左下到右上，表达丸剂生产不断进步。',positions:[[175,565],[500,440],[825,320],[1150,200]],path:'M235 542 L440 464 M560 418 L765 344 M885 298 L1090 223',arrows:[[405,476],[730,357],[1055,236]]},
 {title:'方案三 · 交错阶梯',description:'四个图标左右交错，从上到下依次浏览。',positions:[[340,210],[1010,335],[340,470],[1010,605]],path:'M400 221 L950 324 M950 347 L400 458 M400 482 L950 593',arrows:[[850,305,11],[500,438,169],[850,573,11]]},
 {title:'方案四 · 拱形展开',description:'从左到右沿拱线展开，中心留出较大空间。',positions:[[170,530],[490,290],[860,290],[1180,530]],path:'M219 491 Q330 370 440 320 M550 290 L800 290 M910 320 Q1020 370 1130 491',arrows:[[412,336],[760,290],[1108,468]]},
 {title:'方案五 · 上下两行',description:'先看上排，再看下排，像阅读文字一样从左往右。',positions:[[350,270],[1000,270],[350,590],[1000,590]],path:'M410 270 L940 270 M1000 330 C1000 420 350 420 350 530 M410 590 L940 590',arrows:[[895,270],[675,430,170],[895,590]]}
];
function makeSvg(layout,id){
 const lines=`<path d="${layout.path}" fill="none" stroke="#d6be8d" stroke-width="3" opacity=".65"/>`;
 const arrows=layout.arrows.map(([x,y,rotation])=>`<path d="M${x-9} ${y-9} L${x+2} ${y} L${x-9} ${y+9}" fill="none" stroke="#e8d29e" stroke-width="3" transform="rotate(${rotation||0} ${x} ${y})"/>`).join('');
 const nodes=layout.positions.map(([x,y],i)=>{
  const s=stages[i];return `<g transform="translate(${x} ${y})"><circle r="57" fill="#1c2c26" stroke="#e3cd99" stroke-width="3"/><image href="assets/${s.img}" x="-49" y="-49" width="98" height="98" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle-${id})"/><circle cx="-52" cy="-49" r="20" fill="#d9bf8e"/><text x="-52" y="-41" fill="#233429" font-size="23" text-anchor="middle" font-family="Arial">${i+1}</text><text x="0" y="94" fill="#f3ead6" font-size="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">${s.name}</text><text x="0" y="126" fill="#d7ddd3" font-size="17" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">${s.sub}</text></g>`;
 }).join('');
 return `<svg viewBox="0 0 1350 800" role="img" aria-label="${layout.title}：${layout.description}"><defs><clipPath id="circle-${id}"><circle r="49"/></clipPath></defs><text x="675" y="93" text-anchor="middle" fill="#f3ead6" font-size="39" letter-spacing="10" font-family="KaiTi, SimSun, serif">丸承三百载</text>${lines}${arrows}${nodes}</svg>`;
}
const options=document.getElementById('choices');
options.innerHTML=layouts.map((layout,i)=>`<button class="choice" type="button" data-index="${i}" aria-pressed="${i===0}"><span class="canvas">${makeSvg(layout,'small-'+i)}</span><span class="choice-copy"><span class="number">0${i+1}</span><span class="choice-name">${layout.title.split(' · ')[1]}</span></span></button>`).join('');
function select(index){document.getElementById('selected-title').textContent=layouts[index].title;document.getElementById('selected-description').textContent=layouts[index].description;document.getElementById('large-preview').innerHTML=makeSvg(layouts[index],'large');options.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));}
options.addEventListener('click',event=>{const button=event.target.closest('[data-index]');if(!button)return;select(Number(button.dataset.index));document.querySelector('.viewer').scrollIntoView({behavior:'smooth',block:'start'});});
select(0);
</script>
</body></html>
