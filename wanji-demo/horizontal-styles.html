<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>丸承三百载 · 横向布局五种设计</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ef;color:#222e29;font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1500px;margin:auto;padding:40px 38px 32px}header{border-bottom:1px solid #d9dfd8;padding-bottom:24px}.eyebrow{color:#7b887e;letter-spacing:.16em;font-size:12px;margin:0 0 12px}h1{font-size:29px;font-weight:500;margin:0 0 11px}header p{color:#68776e;line-height:1.8;margin:0;font-size:14px}.viewer{margin-top:25px}.viewer-title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}.viewer-title h2{font-size:20px;font-weight:500;margin:0}.viewer-title p{font-size:13px;color:#738078;margin:0;text-align:right}.canvas{display:block;background-color:#111c1b;background-image:linear-gradient(45deg,rgba(255,255,255,.045) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.045) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.045) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.045) 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0;border-radius:5px;overflow:hidden;line-height:0}.canvas svg{width:100%;height:auto;display:block}.caption{font-size:12px;color:#78867c;line-height:1.8;margin:10px 0 0}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-top:24px}.choice{padding:0;text-align:left;background:#fff;border:1px solid #dce2dc;border-radius:5px;overflow:hidden;cursor:pointer;color:inherit;font:inherit}.choice:hover,.choice[aria-pressed=true]{border-color:#7a9d89;box-shadow:0 0 0 2px rgba(86,139,106,.16)}.choice:focus-visible{outline:3px solid #8db6a0;outline-offset:3px}.choice .canvas{border-radius:0;pointer-events:none}.choice-copy{padding:11px 12px 13px;display:flex;align-items:baseline;gap:9px}.number{font-size:11px;color:#758b7c}.choice-name{font-size:14px}.tip{font-size:13px;color:#68776e;line-height:1.8;margin:24px 0}.back{color:#547565;font-size:13px}footer{border-top:1px solid #d9dfd8;padding-top:16px;margin-top:25px;font-size:12px;color:#78867c;line-height:1.8}@media(max-width:800px){main{padding:25px 16px}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.viewer-title{align-items:flex-start;flex-direction:column;gap:6px}.viewer-title p{text-align:left}h1{font-size:25px}.choice-copy{padding:10px}.canvas{background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}}@media(max-width:360px){.choice-name{font-size:12px}}
</style></head>
<body><main>
<header><p class="eyebrow">丸承三百载 / 横向首页视觉方案</p><h1>同一横向顺序 · 五种视觉风格</h1><p>四个阶段均从左到右排列。选择下方风格，可在上方放大比较。</p></header>
<section class="viewer" aria-label="放大预览"><div class="viewer-title"><h2 id="selected-title"></h2><p id="selected-description"></p></div><div class="canvas" id="large-preview"></div><p class="caption">网格仅用于示意透明区域；画面暂按三块竖屏左右并排的比例假设设计。</p></section>
<section class="choices" id="choices" aria-label="选择视觉方案"></section>
<p class="tip">四个阶段保持独立，图标之间留出空间。图像与文字暂用现有资料，样式和间距可继续调整。</p>
<a class="back" href="layouts.html">查看此前的排列方案 ↗</a>
<footer>首页视觉方向示意 · 页面背景为预览辅助，实际透明、亮度和清晰度需在设备上验证。</footer>
</main>
<script>
const stages=[{name:'源起',sub:'竹匾上的手工时代',period:'手工时代',img:'handcraft.png'},{name:'汇流',sub:'公私合营与半机械化',period:'半机械化',img:'tools.png'},{name:'提速',sub:'工艺现代化的三级跳',period:'工艺现代化',img:'workshop.jpg'},{name:'智造',sub:'从联动线到智慧工厂',period:'智慧生产',img:'production.jpg'}];
const styles=[{title:'方案一 · 中药印章',description:'朱砂印记与古朴画框，突出传统制药的文化气息。',type:'seal'},{title:'方案二 · 历史档案',description:'档案式画框、编号与标签，突出历史演变。',type:'archive'},{title:'方案三 · 传承徽章',description:'圆形徽章与金色刻线，呈现庄重的展馆视觉。',type:'medal'},{title:'方案四 · 智慧展馆',description:'青色线框与简洁图形，突出工艺走向智能的过程。',type:'tech'},{title:'方案五 · 国风长卷',description:'窗棂轮廓与层叠线条，展现柔和的东方美感。',type:'scroll'}];
const positions=[188,513,838,1163];
function frame(s,i,id,type){
 const n=('0'+(i+1)).slice(-2),img=`<image href="assets/${s.img}" x="-85" y="-110" width="170" height="170" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id}-${type})"/>`;
 const names=`<text x="0" y="126" text-anchor="middle" fill="#f5f0df" font-size="31" font-family="Microsoft YaHei, sans-serif">${s.name}</text><text x="0" y="159" text-anchor="middle" fill="#c8d2c9" font-size="16" font-family="Microsoft YaHei, sans-serif">${s.sub}</text>`;
 if(type==='seal')return `<g transform="translate(${positions[i]} 365)"><rect x="-102" y="-127" width="204" height="204" rx="4" fill="#e3d5b9" stroke="#bd9c6a" stroke-width="3"/><rect x="-92" y="-117" width="184" height="184" rx="1" fill="none" stroke="#b79c76"/>${img}<rect x="-110" y="-136" width="38" height="38" fill="#a64d39"/><text x="-91" y="-109" text-anchor="middle" fill="#fff1df" font-size="22">${i+1}</text><text x="78" y="94" text-anchor="end" fill="#dfc5a0" font-size="13" letter-spacing="3">${s.period}</text>${names}</g>`;
 if(type==='archive')return `<g transform="translate(${positions[i]} 365)"><rect x="-111" y="-142" width="222" height="240" rx="2" fill="#e5dcc9"/><rect x="-99" y="-130" width="198" height="194" fill="#d1c3ad"/>${img}<path d="M-94 77 H94" stroke="#baa88b"/><text x="-92" y="94" fill="#756451" font-size="12" font-family="Arial">ARCHIVE / ${n}</text><text x="91" y="94" text-anchor="end" fill="#8d5941" font-size="12">${s.period}</text>${names}</g>`;
 if(type==='medal')return `<g transform="translate(${positions[i]} 365)"><circle cy="-25" r="112" fill="#152a22" stroke="#c6ac76" stroke-width="2"/><circle cy="-25" r="102" fill="none" stroke="#c6ac76" stroke-width="1" stroke-dasharray="2 6"/><circle cy="-25" r="91" fill="none" stroke="#c6ac76" stroke-width="1"/>${img}<circle cx="0" cy="-139" r="22" fill="#c3a66c"/><text x="0" y="-132" text-anchor="middle" fill="#1b3028" font-size="19" font-family="Arial">${n}</text><path d="M-55 103 H-24 M24 103 H55" stroke="#c6ac76"/><circle cy="103" r="3" fill="#c6ac76"/>${names}</g>`;
 if(type==='tech')return `<g transform="translate(${positions[i]} 365)"><rect x="-101" y="-126" width="202" height="202" rx="20" fill="#12303b" fill-opacity=".92" stroke="#62c5ce" stroke-width="2"/><path d="M-92 -83 V-115 H-60 M92 33 V65 H60" fill="none" stroke="#9be6ec" stroke-width="4"/>${img}<rect x="-115" y="-145" width="50" height="26" fill="#102e38" stroke="#62c5ce"/><text x="-90" y="-126" fill="#a1e9ef" font-size="15" text-anchor="middle" font-family="Arial">${n}</text><text x="0" y="97" text-anchor="middle" fill="#8bd9df" font-size="12" letter-spacing="3">${s.period}</text>${names}</g>`;
 return `<g transform="translate(${positions[i]} 365)"><path d="M-102 80 V-24 A102 102 0 0 1 102 -24 V80 Z" fill="#192c27" stroke="#c3af8d" stroke-width="3"/><path d="M-90 68 V-24 A90 90 0 0 1 90 -24 V68 Z" fill="none" stroke="#c3af8d" opacity=".6"/>${img}<path d="M-106 84 Q-75 68 -46 84 T14 84 T74 84 T106 84" fill="none" stroke="#c3af8d" stroke-width="2"/><circle cx="0" cy="-145" r="19" fill="#b9765a"/><text x="0" y="-138" text-anchor="middle" fill="#fff3e3" font-size="18">${i+1}</text>${names}</g>`;
}
function draw(style,id){
 const type=style.type,color=type==='tech'?'#62c5ce':type==='seal'?'#d5b58a':'#d6be8d';
 const clips=type==='seal'?'<rect x="-85" y="-110" width="170" height="170" rx="1"/>':type==='archive'?'<rect x="-85" y="-110" width="170" height="170"/>':type==='medal'?'<circle cx="0" cy="-25" r="85"/>':type==='tech'?'<rect x="-85" y="-110" width="170" height="170" rx="13"/>':'<path d="M-85 60 V-25 A85 85 0 0 1 85 -25 V60 Z"/>';
 let ornaments='';
 if(type==='seal')ornaments='<path d="M522 135 H605 M745 135 H828" stroke="#c8a681" stroke-width="2"/><rect x="665" y="155" width="20" height="20" fill="#a64d39"/>';
 if(type==='archive')ornaments='<text x="675" y="158" text-anchor="middle" fill="#c8b69a" font-size="13" letter-spacing="7">HISTORY  /  FOUR  CHAPTERS</text>';
 if(type==='medal')ornaments='<path d="M532 151 H625 M725 151 H818" stroke="#c6ac76"/><circle cx="675" cy="150" r="4" fill="#c6ac76"/>';
 if(type==='tech')ornaments='<text x="675" y="153" text-anchor="middle" fill="#8bd9df" font-size="12" letter-spacing="6">HISTORY  /  EVOLUTION</text><path d="M485 154 H550 M800 154 H865" stroke="#62c5ce"/>';
 if(type==='scroll')ornaments='<path d="M530 150 Q560 133 590 150 T650 150 M700 150 Q730 133 760 150 T820 150" fill="none" stroke="#c3af8d" stroke-width="2"/>';
 const line=type==='archive'?`<path d="M300 365 H398 M625 365 H723 M950 365 H1048" stroke="${color}" stroke-width="2" stroke-dasharray="4 8" opacity=".7"/>`:`<path d="M300 365 H398 M625 365 H723 M950 365 H1048" stroke="${color}" stroke-width="2" opacity=".7"/>`;
 const arrows=[365,690,1015].map(x=>`<path d="M${x-8} 356 L${x+2} 365 L${x-8} 374" fill="none" stroke="${color}" stroke-width="2"/>`).join('');
 return `<svg viewBox="0 0 1350 800" role="img" aria-label="${style.title}，四个阶段从左到右排列"><defs><clipPath id="${id}-${type}">${clips}</clipPath></defs><text x="675" y="112" text-anchor="middle" fill="#f4eddb" font-size="42" letter-spacing="10" font-family="KaiTi, SimSun, serif">丸承三百载</text>${ornaments}${line}${arrows}${stages.map((s,i)=>frame(s,i,id,type)).join('')}</svg>`;
}
const choices=document.getElementById('choices');
choices.innerHTML=styles.map((style,i)=>`<button class="choice" type="button" data-index="${i}" aria-pressed="${i===0}"><span class="canvas">${draw(style,'small-'+i)}</span><span class="choice-copy"><span class="number">0${i+1}</span><span class="choice-name">${style.title.split(' · ')[1]}</span></span></button>`).join('');
function select(index){document.getElementById('selected-title').textContent=styles[index].title;document.getElementById('selected-description').textContent=styles[index].description;document.getElementById('large-preview').innerHTML=draw(styles[index],'large');choices.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));}
choices.addEventListener('click',event=>{const button=event.target.closest('[data-index]');if(!button)return;select(Number(button.dataset.index));document.querySelector('.viewer').scrollIntoView({behavior:'smooth',block:'start'});});select(0);
</script></body></html>
